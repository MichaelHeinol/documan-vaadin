# Der Worker braucht keinen Webserver. Das spart Arbeitsspeicher und Startzeit.
spring.main.web-application-type=none
# Die Oberfläche läuft nur im Webserver. Der Worker lädt Vaadin deshalb gar nicht erst.
spring.autoconfigure.exclude=com.vaadin.flow.spring.SpringBootAutoConfiguration,com.vaadin.flow.spring.SpringSecurityAutoConfiguration,com.vaadin.flow.spring.VaadinApplicationConfiguration,com.vaadin.flow.spring.VaadinScopesConfig,com.vaadin.flow.spring.VaadinServletConfiguration

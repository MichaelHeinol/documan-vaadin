spring.application.name=documan
spring.main.banner-mode=off

server.port=8000
server.shutdown=graceful
server.error.whitelabel.enabled=false
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
server.tomcat.max-part-count=1000
# Nach einer Stunde ohne Bedienung endet die Sitzung. Herzschläge und Push zählen nicht als Bedienung.
server.servlet.session.timeout=60m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HTTPS:false}
server.forward-headers-strategy=native

# Prepared Statements auf dem Server würden eine Wiederherstellung nicht überleben.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:documan}?prepareThreshold=0
spring.datasource.username=${POSTGRES_USER:documan}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000

spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

vaadin.closeIdleSessions=true
vaadin.heartbeatInterval=60
# Vaadin sucht Seiten beim Start nur in den eigenen Paketen, das spart Zeit.
vaadin.allowed-packages=de.documan
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-private=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{20}: %msg%n
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN

documan.secret-key=${SECRET_KEY}
documan.admin-user=${ADMIN_USER:admin}
documan.admin-password=${ADMIN_PASSWORD:}
documan.admin-email=${ADMIN_EMAIL:}
documan.site-url=${SITE_URL:}
documan.email-host=${EMAIL_HOST:}
documan.email-port=${EMAIL_PORT:587}
documan.email-security=${EMAIL_SECURITY:starttls}
documan.email-host-user=${EMAIL_HOST_USER:}
documan.email-host-password=${EMAIL_HOST_PASSWORD:}
documan.email-from=${EMAIL_FROM:}
documan.registration-enabled=${REGISTRATION_ENABLED:false}
documan.daily-report-time=${DAILY_REPORT_TIME:07:00}
documan.version=${DOCUMAN_VERSION:dev}
documan.microsoft-client-id=${MICROSOFT_CLIENT_ID:}
documan.microsoft-tenant=${MICROSOFT_TENANT:common}
documan.https=${HTTPS:false}
documan.allowed-hosts=${ALLOWED_HOSTS:*}
documan.time-zone=${TIME_ZONE:Europe/Berlin}

documan.media-root=${MEDIA_ROOT:data/media}
documan.consume-dir=${CONSUME_DIR:consume}
documan.backup-dir=${BACKUP_DIR:backup}
documan.consume-host-dir=${CONSUME_HOST_DIR:}
documan.browse-host-dir=${BROWSE_HOST_DIR:}

documan.consume-poll-seconds=${CONSUME_POLL_SECONDS:10}
documan.consume-stable-seconds=${CONSUME_STABLE_SECONDS:10}
documan.max-file-mb=${MAX_FILE_MB:500}

documan.ocr-languages=${OCR_LANGUAGES:deu+eng}
documan.ocr-jobs=${OCR_JOBS:1}
documan.ocr-output-type=${OCR_OUTPUT_TYPE:pdfa}
documan.ocr-timeout-seconds=${OCR_TIMEOUT_SECONDS:3600}

documan.db-host=${POSTGRES_HOST:localhost}
documan.db-port=${POSTGRES_PORT:5432}
documan.db-name=${POSTGRES_DB:documan}
documan.db-user=${POSTGRES_USER:documan}
documan.db-password=${POSTGRES_PASSWORD:}
